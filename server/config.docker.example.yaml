# Docker 环境配置示例
# 复制此文件为 config.docker.yaml 并修改配置

jwt:
    signing-key: your-jwt-secret-key  # ⚠️ 请修改为随机密钥
    expires-time: 7d
    buffer-time: 1d
    issuer: qmPlus

zap:
    level: info
    format: console
    prefix: "[github.com/flipped-aurora/gin-vue-admin/server]"
    director: log
    show-line: true
    encode-level: LowercaseColorLevelEncoder
    stacktrace-key: stacktrace
    log-in-console: true
    retention-day: -1

redis:
    useCluster: false
    addr: 177.7.0.14:6379  # Docker 内部网络地址
    password: ""
    db: 0
    clusterAddrs:
        - "177.7.0.14:7000"
        - "177.7.0.15:7001"
        - "177.7.0.13:7002"

redis-list:
    - name: cache
      useCluster: false
      addr: 177.7.0.14:6379
      password: ""
      db: 0
      clusterAddrs:
          - "177.7.0.14:7000"
          - "177.7.0.15:7001"
          - "177.7.0.13:7002"

mongo:
    coll: ''
    options: ''
    database: ''
    username: ''
    password: ''
    auth-source: ''
    min-pool-size: 0
    max-pool-size: 100
    socket-timeout-ms: 0
    connect-timeout-ms: 0
    is-zap: false
    hosts:
        - host: ''
          port: ''

email:
    to: your-email@example.com
    port: 465
    from: sender@example.com
    host: smtp.example.com
    is-ssl: true
    secret: your-email-password
    nickname: YourName

system:
    env: local
    addr: 8888
    db-type: mysql
    oss-type: local
    use-redis: false
    use-mongo: false
    use-multipoint: false
    iplimit-count: 15000
    iplimit-time: 3600
    router-prefix: ""
    use-strict-auth: false

captcha:
    key-long: 6
    img-width: 240
    img-height: 80
    open-captcha: 0
    open-captcha-timeout: 3600
